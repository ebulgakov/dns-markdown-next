[install]
linker = "hoisted"
[test]
# Test preloads for a bare `bun test` from the repo root (Nx / CI run tests with cwd = the project
# and use its own bunfig.toml). Keep these entries in sync with apps/parser/bunfig.toml and
# apps/api/bunfig.toml.
preload = ["./apps/parser/src/__tests__/setup.ts", "./apps/api/src/__tests__/setup.ts"]
