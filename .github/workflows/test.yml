name: Bun Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Bun tests
        run: bun run test
        env:
          CACHE_PREFIX: ${{ vars.CACHE_PREFIX || '' }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET || '123456789009876543' }}
          API_SECRET_KEY: ${{ secrets.API_SERVICE_KEY || '123456789009876543' }}
          API_SERVICE_KEY: ${{ secrets.API_SERVICE_KEY || '123456789009876543' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/local' }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || 'https://....' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '123456789009876543' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || '123456789009876543' }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || '123456789009876543' }}
          OTEL_SERVICE_NAME: ${{ secrets.OTEL_SERVICE_NAME || 'test-api-enviroment' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT || 'https://test-api-enviroment' }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS || 'https://....' }}
          OTEL_METRICS_EXPORTER: ${{ secrets.OTEL_METRICS_EXPORTER || 'otlp' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '123456789009876543' }}
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL || 'https://....' }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN || '123456789009876543' }}
